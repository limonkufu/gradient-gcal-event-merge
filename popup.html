<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar Gradient Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      width: 320px;
      margin: 0;
      color: CanvasText;
      background: Canvas;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.3;
    }

    label,
    select,
    input {
      font: inherit;
    }

    .toggle-row label,
    .slider-container,
    .color-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .setting-row,
    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .divider {
      border: 0;
      border-top: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      margin: 0;
    }

    input[type="range"],
    .color-preset {
      flex: 1;
      min-width: 0;
    }

    select,
    .hex-input-wrapper {
      border: 1px solid color-mix(in srgb, CanvasText 35%, transparent);
      border-radius: 6px;
      background: Canvas;
      color: CanvasText;
    }

    select {
      padding: 6px;
    }

    .value {
      min-width: 3ch;
      text-align: end;
      font-variant-numeric: tabular-nums;
    }

    .hex-input-wrapper {
      display: flex;
      align-items: center;
      padding-inline-start: 6px;
    }

    .hex-input-wrapper span {
      opacity: 0.7;
    }

    .hex-input {
      width: 6ch;
      border: 0;
      outline: 0;
      padding: 6px 4px;
      background: transparent;
      color: inherit;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .hex-input:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 2px solid Highlight;
      outline-offset: 2px;
    }

    .hex-input.invalid {
      color: #c62828;
    }

    .color-preview {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      border: 1px solid color-mix(in srgb, CanvasText 35%, transparent);
      border-radius: 5px;
    }

    .save-indicator {
      position: absolute;
      overflow: hidden;
      width: 1px;
      height: 1px;
      clip: rect(0 0 0 0);
    }

    .save-indicator.show {
      position: static;
      width: auto;
      height: auto;
      clip: auto;
      color: #188038;
      font-size: 0.75rem;
    }

    .privacy-note {
      margin: 0;
      color: color-mix(in srgb, CanvasText 72%, transparent);
      font-size: 0.75rem;
      line-height: 1.4;
    }

    #status {
      min-height: 1em;
      margin: 0;
      color: #188038;
      font-size: 0.75rem;
    }

    #status:empty {
      display: none;
    }

    #status.error {
      color: #c62828;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="extensionTitle">Gradient Merge</h1>

    <div class="toggle-row">
      <label>
        <input type="checkbox" id="enableExtension">
        <span id="enableText">Enable extension</span>
      </label>
    </div>

    <hr class="divider">

    <div class="toggle-row">
      <label>
        <input type="checkbox" id="enableWeekends">
        <span id="weekendsText">Color weekends</span>
      </label>
    </div>

    <div class="setting-row">
      <label for="gradientOpacity" id="opacityLabel">Gradient opacity</label>
      <div class="slider-container">
        <input type="range" id="gradientOpacity" min="0" max="1" step="0.05">
        <output for="gradientOpacity" id="opacityValue" class="value"></output>
      </div>
    </div>

    <hr class="divider">

    <div class="setting-group">
      <label for="theme-select" id="themeSelectLabel">Theme</label>
      <select id="theme-select">
        <option value="system" id="themeSystemOption">System default</option>
        <option value="light" id="themeLightOption">Light</option>
        <option value="dark" id="themeDarkOption">Dark</option>
      </select>
    </div>

    <div class="setting-group">
      <label for="light-color-preset" id="lightThemeColorLabel">Light theme weekend color</label>
      <div class="color-control">
        <select id="light-color-preset" class="color-preset">
          <option value="" id="colorCustomOption">Custom...</option>
          <option value="#f1f6ff" id="colorDefaultBlueOption">Default blue</option>
          <option value="#f5f5f5" id="colorLightGrayOption">Light gray</option>
          <option value="#fff3e0" id="colorWarmBeigeOption">Warm beige</option>
          <option value="#f3e5f5" id="colorSoftPurpleOption">Soft purple</option>
          <option value="#e8f5e9" id="colorMintGreenOption">Mint green</option>
        </select>
        <label class="hex-input-wrapper">
          <span aria-hidden="true">#</span>
          <input type="text" id="light-hex-color" class="hex-input" maxlength="6"
            pattern="[0-9A-Fa-f]{6}" inputmode="text" autocomplete="off" spellcheck="false"
            aria-labelledby="lightThemeColorLabel">
        </label>
        <span class="color-preview" id="light-preview" aria-hidden="true"></span>
        <span class="save-indicator" id="light-saved" role="status" aria-live="polite"></span>
      </div>
    </div>

    <div class="setting-group">
      <label for="dark-color-preset" id="darkThemeColorLabel">Dark theme weekend color</label>
      <div class="color-control">
        <select id="dark-color-preset" class="color-preset">
          <option value="" id="colorCustomOptionDark">Custom...</option>
          <option value="#1a1a1a" id="colorDefaultDarkOption">Default dark</option>
          <option value="#2d2d2d" id="colorSoftBlackOption">Soft black</option>
          <option value="#263238" id="colorBlueGrayOption">Blue gray</option>
          <option value="#1b1b24" id="colorNavyDarkOption">Navy dark</option>
          <option value="#3a3a3a" id="colorCharcoalOption">Charcoal</option>
        </select>
        <label class="hex-input-wrapper">
          <span aria-hidden="true">#</span>
          <input type="text" id="dark-hex-color" class="hex-input" maxlength="6"
            pattern="[0-9A-Fa-f]{6}" inputmode="text" autocomplete="off" spellcheck="false"
            aria-labelledby="darkThemeColorLabel">
        </label>
        <span class="color-preview" id="dark-preview" aria-hidden="true"></span>
        <span class="save-indicator" id="dark-saved" role="status" aria-live="polite"></span>
      </div>
    </div>

    <p class="privacy-note">
      Event labels and layout are processed only in this Calendar tab to find duplicates. They are never saved or sent.
    </p>
    <p id="status" role="alert" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
